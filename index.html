<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaDrop</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts: Press Start 2P & IBM Plex Sans Thai -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent FOUC: apply saved theme before React hydrates -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mediadrop-theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (stored === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            // fallback to system preference
            if (!window.matchMedia('(prefers-color-scheme: dark)').matches) {
              document.documentElement.classList.remove('dark');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
